; PlantCare R7.2 — FireBeetle 2 ESP32-E (DFR0654)
; 每个 env 只编译一个程序: t1..t10 是分模块测试, app 是整机联通版本, app_noTF 不需要 TF 卡
; 烧录并打开串口:  pio run -e <env> -t upload -t monitor
; 若你们旧工程 PlantCare_R7 的 [env] 里 platform / board 写法不同, 以旧工程能编译的写法为准替换下面两行。

[platformio]
default_envs = app

[env]
platform = espressif32@^6.9.0
board = dfrobot_firebeetle2_esp32e
framework = arduino
board_build.partitions = huge_app.csv      ; 程序区 3 MB (Wi-Fi + HTTPS 需要), 日志区 LittleFS 896 KB, NVS 设置区位置不变
board_build.filesystem = littlefs
monitor_speed = 115200
monitor_echo = yes
monitor_eol = LF
monitor_filters = default, time, log2file   ; 每次打开串口都自动存一份到 logs/ 文件夹 (报告素材)
lib_ldf_mode = chain+
lib_deps =
  olikraus/U8g2@^2.35.19
  adafruit/Adafruit NeoPixel@^1.12.3
  dfrobot/DFRobotDFPlayerMini@^1.0.6
build_flags =
  -I include                  ; 让 lib/ 里的模块也能读到 include/ 的 pins.h、config.h
  -D CORE_DEBUG_LEVEL=0

; ---------------- 分模块测试 ----------------
[env:t1_i2c_scan]
build_src_filter = -<*> +<tests/t1_i2c_scan.cpp>

[env:t2_oled]
build_src_filter = -<*> +<tests/t2_oled.cpp>

[env:t3_probe]
build_src_filter = -<*> +<tests/t3_probe.cpp>

[env:t4_pir]
build_src_filter = -<*> +<tests/t4_pir.cpp>

[env:t5_button]
build_src_filter = -<*> +<tests/t5_button.cpp>

[env:t6_ring]
build_src_filter = -<*> +<tests/t6_ring.cpp>

[env:t7_dfplayer]
build_src_filter = -<*> +<tests/t7_dfplayer.cpp>

[env:t8_power]
build_src_filter = -<*> +<tests/t8_power.cpp>

[env:t9_selftest]
build_src_filter = -<*> +<tests/t9_selftest.cpp>

[env:t10_ai]
build_src_filter = -<*> +<tests/t10_ai.cpp>

; ---------------- 整机联通 ----------------
[env:app]
build_src_filter = -<*> +<app/>

[env:app_noTF]
build_src_filter = -<*> +<app/>
build_flags =
  ${env.build_flags}
  -D NO_TF=1
